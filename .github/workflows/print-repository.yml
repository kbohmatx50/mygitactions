
name: Print Repository Information

on:
  workflow_dispatch:
  push:

jobs:
  print-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print Repository Information
        run: |
          echo "Repository Name: $GITHUB_REPOSITORY"
          echo "Branch Name: $GITHUB_REF_NAME"
          echo "Current Date: $(date +'%Y-%m-%d')"
