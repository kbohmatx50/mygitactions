name: Artifact Demo

on:
  push:
  workflow_dispatch:

env:
  APP_NAME: ArtifactDemo
  BUILD_CONFIGURATION: Release
  APP_ENVIRONMENT: ${{ vars.APP_ENVIRONMENT }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Display GitHub variable
        run: |
          echo "Application: $env:APP_NAME"
          echo "Configuration: $env:BUILD_CONFIGURATION"
          echo "Environment: $env:APP_ENVIRONMENT"

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HelloWorld/HelloWorld.csproj

      - name: Build application
        run: dotnet build HelloWorld/HelloWorld.csproj --configuration $env:BUILD_CONFIGURATION --no-restore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: HelloWorld/bin/$env:BUILD_CONFIGURATION/
