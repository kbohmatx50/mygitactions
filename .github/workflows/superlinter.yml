name: Super-Linter

on: push

jobs:
  super-lint:
    name: Lint code base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Super-Linter needs full git history to accurately diff changes
          fetch-depth: 0

      - name: Install Flake8
        run: pip install flake8

      - name: Lint
        run: flake8 .
